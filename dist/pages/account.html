<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <title>Account</title>
  </head>
  <body>
    <div class="container max-w-3xl">
      <!-- App Bar -->
      <div
        class="fixed top-0 left-0 z-10 flex w-full items-center gap-5 bg-white p-4 text-gray-900"
      >
        <a
          href="#"
          class="hover:text-gray-400 focus:ring-2 focus:ring-green-400 focus:outline-none"
          onclick="history.back()"
        >
          <span
            class="i-material-symbols-arrow-left-alt-rounded text-icon-md block"
          ></span>
        </a>
        <p class="text-lg font-semibold">Akun</p>
      </div>
      <!-- ./ App Bar -->
      <div class="flex min-h-dvh flex-col gap-4 bg-green-50 pb-20">
        <div class="bg-brands-light-green relative h-65"></div>
        <div class="absolute mt-23 flex w-full flex-col gap-10 p-4">
          <!-- Avatar + Name -->
          <div class="flex justify-between">
            <a
              href="#"
              class="flex items-center gap-2 rounded-3xl text-white hover:opacity-70 focus:ring-2 focus:ring-green-400 focus:outline-none"
            >
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ5ExGEHlPHckD3YbxH6e4kr25Ho2X4NifiQA&s"
                alt="Avatar"
                class="size-8 rounded-full object-cover"
              />
              <span class="flex flex-col text-white">
                <span class="text-lg font-semibold ">John Doe</span>
                <span class="text-xs font-semibold "></span>
                <span>5234525235</span>
              </span>
            </a>

            <button
              type="button"
              class="text-brands-light-green inline-flex items-center gap-2 rounded-xl bg-white p-2 text-xs font-semibold uppercase hover:bg-emerald-50 focus:ring-2 focus:outline-none disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-200"
            >
              <span
                class="i-material-symbols-account-balance-wallet text-icon-sm"
              ></span>
              <span>Tarik Saldo</span>
            </button>
          </div>
          <!-- ./Avatar + Name -->

          <!-- Card Menu List -->
          <div class="rounded-2xl bg-white p-2.5 shadow-md">
            <!-- Items -->
            <a href="#" class="flex justify-between rounded-2xl p-3 hover:bg-emerald-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
              <!-- Left -->
              <span class="flex items-center gap-5">
                <span class="i-material-symbols-manage-accounts-rounded text-icon-lg text-brands-light-green shrink-0">
                </span>
                <span class="flex flex-col">
                  <span class="line-clamp-2 text-sm font-semibold text-gray-900">Pengaturan</span>
                </span>
              </span>
              <!-- ./ Left -->
              <!-- Right -->
              <span class="flex shrink-0 items-center gap-2">
                <span class="i-material-symbols-chevron-right-rounded text-icon-md text-gray-900"></span>
              </span>
              <!-- ./ Right -->
            </a>
            <div class="my-2.5 flex gap-4 px-5 whitespace-nowrap last:hidden">
              <div class="h-px w-full grow bg-gray-300"></div>
            </div>
            <!-- ./ Items -->
             <!-- Items -->
            <a href="#" class="flex justify-between rounded-2xl p-3 hover:bg-emerald-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
              <!-- Left -->
              <span class="flex items-center gap-5">
                <span class="i-material-symbols-help-rounded text-icon-lg text-brands-light-green shrink-0">
                </span>
                <span class="flex flex-col">
                  <span class="line-clamp-2 text-sm font-semibold text-gray-900">Pusat Bantuan</span>
                </span>
              </span>
              <!-- ./ Left -->
              <!-- Right -->
              <span class="flex shrink-0 items-center gap-2">
                <span class="i-material-symbols-chevron-right-rounded text-icon-md text-gray-900"></span>
              </span>
              <!-- ./ Right -->
            </a>
            <div class="my-2.5 flex gap-4 px-5 whitespace-nowrap last:hidden">
              <div class="h-px w-full grow bg-gray-300"></div>
            </div>
            <!-- ./ Items -->
             <!-- Items -->
            <a href="#" class="flex justify-between rounded-2xl p-3 hover:bg-emerald-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
              <!-- Left -->
              <span class="flex items-center gap-5">
                <span class="i-material-symbols-book-rounded text-icon-lg text-brands-light-green shrink-0">
                </span>
                <span class="flex flex-col">
                  <span class="line-clamp-2 text-sm font-semibold text-gray-900">Syarat dan ketentuan</span>
                </span>
              </span>
              <!-- ./ Left -->
              <!-- Right -->
              <span class="flex shrink-0 items-center gap-2">
                <span class="i-material-symbols-chevron-right-rounded text-icon-md text-gray-900"></span>
              </span>
              <!-- ./ Right -->
            </a>
            <div class="my-2.5 flex gap-4 px-5 whitespace-nowrap last:hidden">
              <div class="h-px w-full grow bg-gray-300"></div>
            </div>
            <!-- ./ Items -->
             <!-- Items -->
            <a href="#" class="flex justify-between rounded-2xl p-3 hover:bg-emerald-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
              <!-- Left -->
              <span class="flex items-center gap-5">
                <span class="i-material-symbols-info-rounded text-icon-lg text-brands-light-green shrink-0">
                </span>
                <span class="flex flex-col">
                  <span class="line-clamp-2 text-sm font-semibold text-gray-900">Tentang Kusaku</span>
                </span>
              </span>
              <!-- ./ Left -->
              <!-- Right -->
              <span class="flex shrink-0 items-center gap-2">
                <span class="i-material-symbols-chevron-right-rounded text-icon-md text-gray-900"></span>
              </span>
              <!-- ./ Right -->
            </a>
            <div class="my-2.5 flex gap-4 px-5 whitespace-nowrap last:hidden">
              <div class="h-px w-full grow bg-gray-300"></div>
            </div>
            <!-- ./ Items -->
          </div>
          <!-- ./ Card Menu List -->

          <!-- Button Action -->
          <button
            type="button"
            class="hover:bg-brands-light-green text-brands-light-green border-brands-light-greenfocus:ring-green-400 inline-flex items-center justify-center gap-2 rounded-2xl border-2 bg-transparent p-2.5 text-sm font-semibold uppercase hover:text-white focus:ring-2 focus:outline-none disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400"
          >
            <span
              class="i-material-symbols-power-settings-new-outline-rounded text-icon-md"
            ></span>
            <span>KELUAR APLIKASI </span>
          </button>
          <!-- ./ Button Action -->
        </div>
      </div>
      <!-- Navbar -->
      <div
        class="fixed bottom-0 left-0 z-10 flex w-full justify-evenly bg-white"
      >
        <a
          href=""
          class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
        >
          <span
            class="i-material-symbols-home-outline-rounded text-icon-md inline group-hover:hidden"
          ></span>
          <span
            class="i-material-symbols-home-rounded text-icon-md hidden group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Beranda</span>
        </a>
        <a
          href=""
          class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
        >
          <span
            class="i-material-symbols-receipt-outline-rounded text-icon-md inline group-hover:hidden"
          ></span>
          <span
            class="i-material-symbols-receipt-rounded text-icon-md hidden group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Riwayat</span>
        </a>
        <a
          href=""
          class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
        >
          <span
            class="i-material-symbols-account-circle-outline text-icon-md inline group-hover:hidden"
          ></span>
          <span
            class="i-material-symbols-account-circle text-icon-md hidden group-hover:inline"
          ></span>
          <span class="text-xs font-semibold">Akun</span>
        </a>
      </div>
      <!-- ./ Navbar -->
    </div>
  </body>
</html>
