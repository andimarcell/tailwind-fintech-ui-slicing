<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <title>Withdrawal</title>
  </head>
  <body>
    <div class="container max-w-3xl">
      <!-- App Bar -->
      <div
        class="fixed top-0 left-0 z-10 flex w-full items-center gap-5 bg-white p-4 text-gray-900"
      >
        <a
          href="#"
          class="hover:text-gray-400 focus:ring-2 focus:ring-green-400 focus:outline-none"
          onclick="history.back()"
        >
          <span
            class="i-material-symbols-arrow-left-alt-rounded text-icon-md block"
          ></span>
        </a>
        <p class="text-lg font-semibold">Buat Penarikan Saldo</p>
      </div>
      <!-- ./ App Bar -->
      <div class="flex min-h-dvh flex-col gap-4 bg-green-50 pb-20">
        <div class="mt-23 flex w-full flex-col gap-8 p-6">

          <!-- Card Penarikan Dana -->
          <form
            action="#"
            method="post"
            class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md"
          >
            <!-- Title -->
            <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
              Penarikan Dana
            </div>
            <!-- ./ Title -->

            <!-- Input Nominal -->
            <div>
              <label
                for="my-input-text"
                class="ps-4 text-sm font-medium text-gray-900 uppercase"
                >NOMINAL</label
              >
              <div class="group relative">
                <input
                  id="input-nominal"
                  type="number"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                  placeholder="Tersedia: Rp. 20.000.000"
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-account-balance-wallet"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Nomor Rekening -->

            <!-- Input Pin -->
            <div>
              <label
                for="my-input-text"
                class="ps-4 text-sm font-medium text-gray-900 uppercase"
                >PIN</label
              >
              <div class="group relative">
                <input
                  id="input-pin"
                  type="number"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                  placeholder="Masukkan 6 digit PIN"
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-security-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Pin Lama -->

            <!-- Button Action -->
            <button type="button" class="bg-brands-light-green hover:bg-brands-dark-green inline-flex items-center gap-2 rounded-xl border-2 border-transparent p-2.5 text-sm font-semibold text-white uppercase focus:ring-2 focus:ring-green-400 focus:outline-none justify-center disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400">
            <span class="i-material-symbols-save-rounded text-icon-md"></span>
            <span>PROSES PERMINTAAN</span>
          </button>
            <!-- ./ Button Action -->
             <!-- Help Text -->
            <p class="mt-3 text-center text-xs text-neutral-400">
              Proses pencairan maks 2 hari kerja.
              <br>
              <a
                href="#"
                class="text-brands-light-green hover:text-brands-light-green/70 text-xs font-semibold focus:ring-2 focus:ring-green-400 focus:outline-none"
                >Hubungi Pusat Bantuan</a
              >
              jika ada kendala.
            </p>
            <!-- ./ Help Text -->
          </form>
          <!-- ./ Card Penarikan Dana -->
           
        </div>
      </div>
    </div>
    <!-- Navbar -->
    <div class="fixed bottom-0 left-0 z-10 flex w-full justify-evenly bg-white">
      <a
        href=""
        class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
      >
        <span
          class="i-material-symbols-home-outline-rounded text-icon-md inline group-hover:hidden"
        ></span>
        <span
          class="i-material-symbols-home-rounded text-icon-md hidden group-hover:inline"
        ></span>
        <span class="text-xs font-semibold">Beranda</span>
      </a>
      <a
        href=""
        class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
      >
        <span
          class="i-material-symbols-receipt-outline-rounded text-icon-md inline group-hover:hidden"
        ></span>
        <span
          class="i-material-symbols-receipt-rounded text-icon-md hidden group-hover:inline"
        ></span>
        <span class="text-xs font-semibold">Riwayat</span>
      </a>
      <a
        href=""
        class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
      >
        <span
          class="i-material-symbols-account-circle-outline text-icon-md inline group-hover:hidden"
        ></span>
        <span
          class="i-material-symbols-account-circle text-icon-md hidden group-hover:inline"
        ></span>
        <span class="text-xs font-semibold">Akun</span>
      </a>
    </div>
    <!-- ./ Navbar -->
  </body>
</html>
