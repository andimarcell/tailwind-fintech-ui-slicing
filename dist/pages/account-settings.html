<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <title>Account Settings</title>
  </head>
  <body>
    <div class="container max-w-3xl">
      <!-- App Bar -->
      <div
        class="fixed top-0 left-0 z-10 flex w-full items-center gap-5 bg-white p-4 text-gray-900"
      >
        <a
          href="#"
          class="hover:text-gray-400 focus:ring-2 focus:ring-green-400 focus:outline-none"
          onclick="history.back()"
        >
          <span
            class="i-material-symbols-arrow-left-alt-rounded text-icon-md block"
          ></span>
        </a>
        <p class="text-lg font-semibold">Pengaturan Akun</p>
      </div>
      <!-- ./ App Bar -->
      <div class="flex min-h-dvh flex-col gap-4 bg-green-50 pb-20">
        <div class="mt-23 flex w-full flex-col gap-8 p-6">
          <!-- Card Informasi Personal -->
          <form
            action="#"
            method="post"
            class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md"
          >
            <!-- Title -->
            <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
              Informasi Personal
            </div>
            <!-- ./ Title -->

            <!-- Input File -->
            <div class="mb-6 flex justify-center">
              <label for="file-upload" class="cursor-pointer">
                <div
                  class="flex size-25 items-center justify-center rounded-full bg-gray-300 hover:opacity-70"
                >
                  <span
                    class="i-material-symbols-upload-rounded text-icon-xl text-gray-900"
                  ></span>
                </div>
                <input id="file-upload" type="file" class="hidden" />
              </label>
            </div>
            <!-- ./Input File -->

            <!-- Input Nama -->
            <div>
              <label
                for="my-input-text"
                class="ps-4 text-sm font-medium text-gray-900 uppercase"
                >Nama</label
              >
              <div class="group relative">
                <input
                  id="input-nama"
                  type="text"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                  placeholder="Masukkan Nama"
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-person-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Nama -->

            <!-- Input Email -->
            <div>
              <label
                for="my-input-text"
                class="ps-4 text-sm font-medium text-gray-900 uppercase"
                >Email</label
              >
              <div class="group relative">
                <input
                  id="input-email"
                  type="email"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                  placeholder="Masukkan Email"
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-mail-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Email -->

            <!-- Button Action -->
            <button
              type="button"
              class="hover:bg-brands-light-green text-brands-light-green border-brands-light-green inline-flex items-center justify-center gap-2 rounded-xl border-2 bg-transparent p-2.5 text-sm font-semibold uppercase hover:text-white focus:ring-2 focus:ring-green-400 focus:outline-none disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400"
            >
              <span class="i-material-symbols-save-rounded text-icon-md"></span>
              <span>Simpan Perubahan</span>
            </button>
            <!-- ./ Button Action -->
          </form>
          <!-- ./Card Informasi Personal -->

          <!-- Card Kemanan PIN -->
          <form
            action="#"
            method="post"
            class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md"
          >
            <!-- Title -->
            <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
              Keamanan PIN
            </div>
            <!-- ./ Title -->

            <!-- Input Pin Lama -->
            <div>
              <label
                for="my-input-text"
                class="ps-4 text-sm font-medium text-gray-900 uppercase"
                >PIN LAMA</label
              >
              <div class="group relative">
                <input
                  id="input-pin-lama"
                  type="number"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                  placeholder="Masukkan 6 digit PIN lama"
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-security-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Pin Lama -->

            <!-- Input Pin Baru -->
            <div>
              <label
                for="my-input-text"
                class="ps-4 text-sm font-medium text-gray-900 uppercase"
                >PIN BARU</label
              >
              <div class="group relative">
                <input
                  id="input-pin-baru"
                  type="number"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                  placeholder="Buat 6 digit PIN baru"
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-mail-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Pin Baru -->

            <!-- Button Action -->
            <button
              type="button"
              class="hover:bg-brands-light-green text-brands-light-green border-brands-light-green inline-flex items-center justify-center gap-2 rounded-xl border-2 bg-transparent p-2.5 text-sm font-semibold uppercase hover:text-white focus:ring-2 focus:ring-green-400 focus:outline-none disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400"
            >
              <span class="i-material-symbols-save-rounded text-icon-md"></span>
              <span>Simpan Perubahan</span>
            </button>
            <!-- ./ Button Action -->
          </form>
          <!-- ./ Card Kemanan PIN -->

          <!-- Card Penarikan Dana -->
          <form
            action="#"
            method="post"
            class="flex flex-col gap-4 rounded-[20px] bg-white p-2.5 shadow-md"
          >
            <!-- Title -->
            <div class="mb-6 ps-4 text-xl font-semibold text-gray-900">
              Penarikan Dana
            </div>
            <!-- ./ Title -->

            <!-- Input Pilih Bank -->
            <div>
          <label for="my-input-text" class="ps-4 text-sm font-medium text-gray-900 uppercase">PILIH BANK</label>
          <div class="group relative">
            <input id="my-input-text" type="email" class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300" placeholder="Pilih bank tujuan penarikan...">
            <div class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
              <span class="i-material-symbols-account-balance-rounded"></span>
            </div>
            <div class="text-icon-md absolute inset-y-0 inset-e-0 flex items-center pe-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900">
              <span class="i-material-symbols-keyboard-arrow-down-rounded"></span>
            </div>
          </div>

        </div>
            <!-- ./Input Pilih Bank -->

            <!-- Input Nama Rekening -->
            <div>
              <label
                for="my-input-text"
                class="ps-4 text-sm font-medium text-gray-900 uppercase"
                >NAMA DI REKENING</label
              >
              <div class="group relative">
                <input
                  id="input-nama-rekening"
                  type="text"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                  placeholder="Masukkan nama pemilik rekening..."
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-person-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Nama Rekening -->

            <!-- Input Nomor Rekening -->
            <div>
              <label
                for="my-input-text"
                class="ps-4 text-sm font-medium text-gray-900 uppercase"
                >NO. REKENING</label
              >
              <div class="group relative">
                <input
                  id="input-nama-rekening"
                  type="text"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                  placeholder="Masukkan No. Rekening..."
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-account-balance-wallet"></span>
                </div>
              </div>
            </div>
            <!-- ./Input Nomor Rekening -->

            <!-- Button Action -->
            <button
              type="button"
              class="hover:bg-brands-light-green text-brands-light-green border-brands-light-green inline-flex items-center justify-center gap-2 rounded-xl border-2 bg-transparent p-2.5 text-sm font-semibold uppercase hover:text-white focus:ring-2 focus:ring-green-400 focus:outline-none disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400"
            >
              <span class="i-material-symbols-save-rounded text-icon-md"></span>
              <span>Simpan Perubahan</span>
            </button>
            <!-- ./ Button Action -->
          </form>
          <!-- ./ Card Penarikan Dana -->
        </div>
      </div>
    </div>
    <!-- Navbar -->
    <div class="fixed bottom-0 left-0 z-10 flex w-full justify-evenly bg-white">
      <a
        href=""
        class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
      >
        <span
          class="i-material-symbols-home-outline-rounded text-icon-md inline group-hover:hidden"
        ></span>
        <span
          class="i-material-symbols-home-rounded text-icon-md hidden group-hover:inline"
        ></span>
        <span class="text-xs font-semibold">Beranda</span>
      </a>
      <a
        href=""
        class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
      >
        <span
          class="i-material-symbols-receipt-outline-rounded text-icon-md inline group-hover:hidden"
        ></span>
        <span
          class="i-material-symbols-receipt-rounded text-icon-md hidden group-hover:inline"
        ></span>
        <span class="text-xs font-semibold">Riwayat</span>
      </a>
      <a
        href=""
        class="group flex w-full flex-col items-center p-3 text-gray-900 hover:bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none"
      >
        <span
          class="i-material-symbols-account-circle-outline text-icon-md inline group-hover:hidden"
        ></span>
        <span
          class="i-material-symbols-account-circle text-icon-md hidden group-hover:inline"
        ></span>
        <span class="text-xs font-semibold">Akun</span>
      </a>
    </div>
    <!-- ./ Navbar -->
  </body>
</html>
