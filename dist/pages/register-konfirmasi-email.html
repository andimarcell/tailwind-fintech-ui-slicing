<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <title>Konfirmasi Email</title>
  </head>
  <body>
    <div class="container max-w-3xl">
      <div
        class="flex h-dvh flex-col items-center justify-center bg-green-50 p-4"
      >
        <div class="flex w-full flex-col">
          <!-- Illustration -->
          <img
            src="../assets/images/email-sent.svg"
            alt="Illustration"
            class="h-40"
          />
          <!-- ./ Illustration -->

          <!-- Title & Description -->
          <div class="mt-8 mb-5 flex flex-col">
            <h1 class="text-center text-lg font-semibold text-gray-900">
              Konfirmasi Email
            </h1>
            <p class="text-center text-xs font-medium text-gray-400">
              Silahkan cek inbox email Anda dan klik link yang kami kirim untuk
              konfirmasi email Anda. Jika belum muncul tunggu beberapa menit
              atau klik tombol ini
            </p>
          </div>
          <!-- ./ Title & Description -->

          <!-- Form -->
          <form action="" method="post" class="flex flex-col gap-4">
            <!-- Button Action -->
            <button
            type="button"
            class="hover:bg-brands-light-green text-brands-light-green border-brands-light-greenfocus:ring-green-400 justify-center disabled:cursor-not-allowed inline-flex items-center gap-2 rounded-xl border-2 bg-transparent p-2.5 text-center text-sm font-semibold uppercase hover:text-white focus:ring-2 focus:outline-none disabled:border-gray-300 disabled:bg-transparent disabled:text-gray-400"
            >
            <span
            class="i-material-symbols-send-rounded text-icon-md"
            ></span>
            <span>KIRIM ULANG</span>
        </button>
        <!-- Button Action -->
        
            <!-- Keluar -->
            <p class="mt-2 text-center text-xs text-neutral-400">
              <a
                href="#"
                class="text-brands-light-green hover:text-brands-light-green/70 text-xs font-semibold focus:ring-2 focus:ring-green-400 focus:outline-none"
                >Keluar</a
              >
            </p>
            <!-- ./ Keluar -->
          </form>
          <!-- ./ Form -->
        </div>
      </div>
    </div>
  </body>
</html>
