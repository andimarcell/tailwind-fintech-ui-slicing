<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/output.css" />
    <link
      rel="shortcut icon"
      href="../assets/images/favicon.ico"
      type="image/x-icon"
    />
    <title>Register Pin</title>
  </head>
  <body>
    <div class="container max-w-3xl">
      <div class="flex h-dvh flex-col items-center justify-center bg-green-50 p-4">
        <div class="flex w-full flex-col">
          <!-- Illustration -->
          <img
            src="../assets/images/fingerprint.svg"
            alt="Illustration"
            class="h-40"
          />
          <!-- ./ Illustration -->

          <!-- Title & Description -->
          <div class="mt-8 mb-5 flex flex-col">
            <h1 class="text-center text-lg font-semibold text-gray-900">
              Buat 6 Digit PIN
            </h1>
            <p class="text-center text-xs font-medium text-gray-400">
              Buatlah 6 digit PIN untuk masuk lebih aman
            </p>
          </div>
          <!-- ./ Title & Description -->

          <!-- Form -->
          <form action="" method="post" class="flex flex-col gap-4">
            <!-- Input Pin -->
            <div class="flex flex-col gap-y-1.5">
              <div class="group relative">
                <input
                  placeholder="6 Digit PIN"
                  type="number"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-security-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./ Input Pin -->

            <!-- Konfirmasi Ulang PIN -->
            <div class="flex flex-col gap-y-1.5">
              <div class="group relative">
                <input
                  placeholder="Konfirmasi Ulang PIN"
                  type="number"
                  class="peer w-full rounded-2xl border border-gray-400 bg-white p-3 ps-12 pe-12 text-sm text-gray-900 transition-colors duration-300 placeholder:text-gray-400 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:placeholder-green-400 focus:ring-2 focus:ring-green-400 focus:outline-none focus:invalid:ring-red-900 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300"
                />
                <div
                  class="text-icon-md absolute inset-y-0 inset-s-0 flex items-center ps-4 text-gray-400 group-focus-within:text-green-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
                >
                  <span class="i-material-symbols-security-rounded"></span>
                </div>
              </div>
            </div>
            <!-- ./ Konfirmasi Ulang PIN -->

            <!-- Button Action -->
            <button
              type="button"
              class="bg-brands-light-green hover:bg-brands-dark-green inline-flex items-center justify-center gap-2 rounded-xl border-2 border-transparent p-2.5 text-sm font-semibold text-white uppercase focus:ring-2 focus:ring-green-400 focus:outline-none disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400"
            >
              <span>Lanjutkan</span>
              <span
                class="i-material-symbols-chevron-right-rounded text-icon-md"
              ></span>
            </button>
            <!-- ./ Button Action -->

            <!-- Help Text -->
            <p class="mt-3 text-center text-xs text-neutral-400">
              Dengan masuk atau daftar, Anda sudah setuju dengan
              <a
                href="#"
                class="text-brands-light-green hover:text-brands-light-green/70 text-xs font-semibold focus:ring-2 focus:ring-green-400 focus:outline-none"
                >Ketentuan Layanan</a
              >
              dan
              <a
                href="#"
                class="text-brands-light-green hover:text-brands-light-green/70 text-xs font-semibold focus:ring-2 focus:ring-green-400 focus:outline-none"
                >Kebijakan Privasi</a
              >
              KUSAKU
            </p>
            <!-- ./ Help Text -->
          </form>
          <!-- ./ Form -->
        </div>
      </div>
    </div>
  </body>
</html>
